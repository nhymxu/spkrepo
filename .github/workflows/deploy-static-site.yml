name: Deploy static site

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "data/**"
  #     - "tools/dsm_catalog.py"
  #     - "tools/render_static_catalog.py"
  #     - "tools/render_static_page.py"
  #     - "packages/*/icon_72.png"
  #     - "packages/*/icon_256.png"
  #     - ".github/workflows/deploy-static-site.yml"
  workflow_dispatch: {}

# Set these in Settings -> Secrets and variables -> Actions -> Variables:
#   SPK_ARCH  e.g. x86_64 (must match the single arch your fleet reports)
#   SPK_BUILD e.g. 64570  (a DSM7 firmware build number -- see README)
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check required repo variables
        run: |
          missing=()
          [ -z "${{ vars.SPK_ARCH }}" ] && missing+=("SPK_ARCH")
          [ -z "${{ vars.SPK_BUILD }}" ] && missing+=("SPK_BUILD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo variable(s): ${missing[*]}. Set them under Settings -> Secrets and variables -> Actions -> Variables (see README)." >&2
            exit 1
          fi

      - name: Render static catalog
        run: python3 tools/render_static_catalog.py --arch "${{ vars.SPK_ARCH }}" --build "${{ vars.SPK_BUILD }}" --out dist/index.json

      - name: Render info page
        run: |
          python3 tools/render_static_page.py --arch "${{ vars.SPK_ARCH }}" --build "${{ vars.SPK_BUILD }}" \
            --out dist/index.html \
            --index-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.json"

      - name: Copy package icons
        run: |
          mkdir -p dist/icons
          for pkg_dir in packages/*/; do
            pkg="$(basename "$pkg_dir")"
            [ -f "${pkg_dir}icon_72.png" ] && cp "${pkg_dir}icon_72.png" "dist/icons/${pkg}-72.png"
            [ -f "${pkg_dir}icon_256.png" ] && cp "${pkg_dir}icon_256.png" "dist/icons/${pkg}-256.png"
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
