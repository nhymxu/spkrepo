name: Build Forgejo package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Forgejo version to build, e.g. 15.0.4 (must match an upstream v<version> release)"
        required: true
      rev:
        description: "Package revision (bump for a packaging-only rebuild of the same version)"
        required: false
        default: "1"

jobs:
  build:
    uses: ./.github/workflows/build-package.yml
    with:
      package: forgejo
      version: ${{ inputs.version }}
      rev: ${{ inputs.rev }}
    permissions:
      contents: write
