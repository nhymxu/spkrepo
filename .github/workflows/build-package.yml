name: Build package (reusable)

# Shared build->release->publish pipeline for every app under packages/.
# Called by the thin per-app dispatch workflows (build-forgejo.yml,
# build-gitea.yml, ...) -- not meant to be run directly.

on:
  workflow_call:
    inputs:
      package:
        description: "Directory name under packages/, e.g. forgejo"
        required: true
        type: string
      version:
        description: "App version to build, e.g. 15.0.4"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Each packages/<app>/build.requires lists the toolchains that
      # package's build.sh needs (one per line: go, node) -- apps with a
      # prebuilt-binary build.sh (see docs/add-new-app-guide.md) can omit
      # the file entirely and skip every toolchain step below.
      - name: Detect build requirements
        id: requires
        run: |
          requires_file="packages/${{ inputs.package }}/build.requires"
          needs_go=false
          needs_node=false
          if [ -f "${requires_file}" ]; then
            if grep -qx "go" "${requires_file}"; then needs_go=true; fi
            if grep -qx "node" "${requires_file}"; then needs_node=true; fi
          fi
          echo "go=${needs_go}" >> "$GITHUB_OUTPUT"
          echo "node=${needs_node}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        if: steps.requires.outputs.go == 'true'
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v7
        if: steps.requires.outputs.node == 'true'
        with:
          node-version: "24"

      - name: Enable corepack (for packages whose frontend build pins a pnpm version)
        if: steps.requires.outputs.node == 'true'
        run: corepack enable

      - name: Build .spk
        id: build
        run: |
          packages/${{ inputs.package }}/build.sh --version "${{ inputs.version }}"
          echo "spk_path=packages/${{ inputs.package }}/dist/${{ inputs.package }}-${{ inputs.version }}-x86_64.spk" >> "$GITHUB_OUTPUT"

      - name: Create release and upload .spk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.package }}-v${{ inputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" \
            "${{ steps.build.outputs.spk_path }}" \
            --title "${{ inputs.package }} v${{ inputs.version }}" \
            --notes "${{ inputs.package }} v${{ inputs.version }}, built from source for DSM7 x86_64."

      - name: Update catalog index
        run: |
          asset_url="https://github.com/${{ github.repository }}/releases/download/${{ inputs.package }}-v${{ inputs.version }}/${{ inputs.package }}-${{ inputs.version }}-x86_64.spk"
          python3 tools/spk_to_payload.py "${{ steps.build.outputs.spk_path }}" \
            --link "$asset_url" \
            --write-index data/packages.json

      - name: Commit and push
        run: |
          cat data/packages.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/packages.json
          git commit -m "feat: publish ${{ inputs.package }} v${{ inputs.version }}"
          git push
