name: Build package (reusable)

# Shared build->release->publish pipeline for every app under packages/.
# Called by the thin per-app dispatch workflows (build-forgejo.yml,
# build-gitea.yml, ...) -- not meant to be run directly.

on:
  workflow_call:
    inputs:
      package:
        description: "Directory name under packages/, e.g. forgejo"
        required: true
        type: string
      version:
        description: "App version to build, e.g. 15.0.4"
        required: true
        type: string
      rev:
        description: "Package revision (packaging-only rebuild of the same upstream version bumps this)"
        required: false
        type: string
        default: "1"

permissions:
  contents: write

jobs:
  build-release-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Each packages/<app>/build.requires lists the toolchains that
      # package's build.sh needs (one per line: go, node) -- apps with a
      # prebuilt-binary build.sh (see docs/add-new-app-guide.md) can omit
      # the file entirely and skip every toolchain step below.
      - name: Detect build requirements
        id: requires
        run: |
          requires_file="packages/${{ inputs.package }}/build.requires"
          needs_go=false
          needs_node=false
          if [ -f "${requires_file}" ]; then
            if grep -qx "go" "${requires_file}"; then needs_go=true; fi
            if grep -qx "node" "${requires_file}"; then needs_node=true; fi
          fi
          echo "go=${needs_go}" >> "$GITHUB_OUTPUT"
          echo "node=${needs_node}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        if: steps.requires.outputs.go == 'true'
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v7
        if: steps.requires.outputs.node == 'true'
        with:
          node-version: "24"

      - name: Enable corepack (for packages whose frontend build pins a pnpm version)
        if: steps.requires.outputs.node == 'true'
        run: corepack enable

      - name: Build .spk
        id: build
        run: |
          packages/${{ inputs.package }}/build.sh --version "${{ inputs.version }}" --rev "${{ inputs.rev }}"
          pkg_version="${{ inputs.version }}-${{ inputs.rev }}"
          echo "pkg_version=${pkg_version}" >> "$GITHUB_OUTPUT"
          echo "spk_path=packages/${{ inputs.package }}/dist/${{ inputs.package }}-${pkg_version}-x86_64.spk" >> "$GITHUB_OUTPUT"

      - name: Create release and upload .spk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.package }}-v${{ steps.build.outputs.pkg_version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" \
            "${{ steps.build.outputs.spk_path }}" \
            --title "${{ inputs.package }} v${{ steps.build.outputs.pkg_version }}" \
            --notes "${{ inputs.package }} v${{ steps.build.outputs.pkg_version }}, built from source for DSM7 x86_64."

      - name: Update catalog index
        run: |
          # Icons are served from GitHub Pages (deploy-static-site.yml copies
          # packages/<pkg>/icon_*.png into dist/icons/), not Release assets --
          # only the .spk binary lives on the Release.
          release_base_url="https://github.com/${{ github.repository }}/releases/download/${{ inputs.package }}-v${{ steps.build.outputs.pkg_version }}"
          pages_base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/icons"
          thumbnail_args=()
          if [ -f "packages/${{ inputs.package }}/icon_72.png" ]; then
            thumbnail_args+=(--thumbnail "$pages_base_url/${{ inputs.package }}-72.png")
          fi
          if [ -f "packages/${{ inputs.package }}/icon_256.png" ]; then
            thumbnail_args+=(--thumbnail-retina "$pages_base_url/${{ inputs.package }}-256.png")
          fi
          python3 tools/spk_to_payload.py "${{ steps.build.outputs.spk_path }}" \
            --link "$release_base_url/${{ inputs.package }}-${{ steps.build.outputs.pkg_version }}-x86_64.spk" \
            "${thumbnail_args[@]}" \
            --write-index data/packages.json

      - name: Commit and push
        run: |
          cat data/packages.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/packages.json
          git commit -m "feat: publish ${{ inputs.package }} v${{ steps.build.outputs.pkg_version }}"
          git push
